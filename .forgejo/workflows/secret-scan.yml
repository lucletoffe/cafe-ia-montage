# Secret-scan CI (gitleaks) — bug 034EYVPw / action AHeEDnSb
# Copie du modèle undust--portal, pin SHA256 du gabarit tools--template.
# Bloque le merge si un secret est détecté dans l'arbre courant.
# Historique volontairement non scanné (--no-git) : les vieux secrets déjà
# tournés casseraient toutes les CI d'un coup. Un audit historique doit
# être une opération ponctuelle, pas un blocker CI permanent.
# Baseline : `.gitleaks.toml` en racine si faux positifs.

name: Secret Scan

on:
  pull_request:
  push:
    branches: [ main, master ]

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
      - name: Install gitleaks
        # Voies, toutes vérifiées par la même empreinte sha256 : cache d'outils du runner
        # (volume forgejo-ci-toolcache monté sur /opt/hostedtoolcache) → release GitHub avec
        # relances → API assets GitHub. Une panne des téléchargements GitHub (504 du 08/11/2026)
        # ne passe plus Secret Scan rouge. Même logique que fractal--local-scripts ci/install-gitleaks.sh.
        # Monter de version : GITLEAKS_VERSION, sha256 (checksums.txt officiel de la release) et
        # asset_id (api.github.com/repos/gitleaks/gitleaks/releases/tags/vX), ensemble.
        run: |
          set -euo pipefail
          sha256="a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
          asset_id="274652672"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cache="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/gitleaks/${GITLEAKS_VERSION}"
          tgz="$(mktemp -d)/$archive"
          sha_ok() { echo "$sha256  $1" | sha256sum -c --status -; }
          src=""
          # La copie privée est vérifiée, pas le fichier partagé : un autre job peut le remplacer.
          if cp "$cache/$archive" "$tgz" 2>/dev/null && sha_ok "$tgz"; then
            src="cache $cache"
          else
            rm -f "$tgz"
            for url in "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive" \
                       "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/$asset_id"; do
              # Borné pour tenir dans timeout-minutes: 5 avec les deux voies (≤ ~2 min chacune) ;
              # un transfert figé (< 1 Ko/s pendant 20 s) est coupé et relancé.
              if curl -sSfL --retry 3 --retry-delay 5 --retry-max-time 80 --retry-all-errors \
                   --connect-timeout 15 --max-time 40 --speed-limit 1024 --speed-time 20 \
                   -H 'Accept: application/octet-stream' "$url" -o "$tgz" && sha_ok "$tgz"; then
                src="$url"
                break
              fi
              echo "install gitleaks : échec ou empreinte fausse via $url" >&2
              rm -f "$tgz"
            done
            if [ -z "$src" ]; then
              echo "::error::gitleaks ${GITLEAKS_VERSION} introuvable (cache, release, API) — panne de téléchargement, pas un constat de secret" >&2
              exit 1
            fi
            # Recopie atomique dans le cache, lisible par tous ; un cache absent ou en lecture seule ne fait pas échouer le job.
            if mkdir -p "$cache" 2>/dev/null && part="$(mktemp "$cache/.$archive.XXXXXX" 2>/dev/null)"; then
              { cp "$tgz" "$part" && chmod 0644 "$part" && mv -f "$part" "$cache/$archive"; } 2>/dev/null || rm -f "$part" 2>/dev/null || true
            fi
          fi
          echo "$sha256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C /usr/local/bin gitleaks
          echo "install gitleaks : ${GITLEAKS_VERSION} depuis $src"
          gitleaks version
      - name: Gitleaks scan (working tree, no history)
        run: gitleaks detect --source . --no-git --redact --exit-code 1 --verbose
